<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Alexus Carter Profile Card</title>
  </head>
  <body>
    <main>
      <div class="container">
        <article class="card-inner">
          <div class="card-top">
            <div class="profile-circle"><span class="initials">AC</span></div>

            <h1 class="profile-name">Alexus Carter</h1>
            <p class="title">Front end developer in training</p>
            <div class="followers">
              <span class="follower-count">128</span><span>followers</span>
            </div>
            <button type="button" class="button follow-btn" aria-pressed="false">
              Follow
            </button>
          </div>

          <hr class="divider" />

          <ul class="links">
            <li>
              <a class="link-row" href="https://github.com/alexuscarter">
                <span class="link-text">
                  <span class="link-label">GitHub</span>
                  <span class="link-handle">github.com/alexuscarter</span>
                </span>
                <span class="link-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a
                class="link-row"
                href="https://www.linkedin.com/in/alexuscarter"
              >
                <span class="link-text">
                  <span class="link-label">LinkedIn</span>
                  <span class="link-handle">linkedin.com/in/alexuscarter</span>
                </span>
                <span class="link-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a class="link-row" href="mailto:contact@alexuscarter.com">
                <span class="link-text">
                  <span class="link-label">Email</span>
                  <span class="link-handle">contact@alexuscarter.com</span>
                </span>
                <span class="link-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ul>
        </article>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
